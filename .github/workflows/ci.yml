name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The GPU job below runs on nothing but this. See its comment for why a push
  # trigger would be worse than no trigger.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -count=2 because the scheduler's tests are about concurrency, and a
      # concurrency test that has only ever passed once has not passed yet.
      # -race is the point of running this on Linux: the toolchain needs cgo
      # for it, which a plain Windows checkout does not have.
      - name: Test
        run: go test -race -count=2 ./...

      # The allocation gate, run without -race.
      #
      # The race detector allocates on its own account, so allocs/op under it is
      # a different number and not a stable one. The gate is about the code's
      # allocations, so it gets a plain run -- and it is cheap, because the
      # benchmark it drives is against the mock backend.
      - name: Allocation regression gate
        run: go test -run TestTheHotLoopDoesNotGrowItsAllocations -count=1 -v ./internal/sched/

      # Fuzz seeds run in the normal suite; this gives the response parser a
      # minute of actual fuzzing on every push. Any crash is written to
      # testdata/ and fails the job.
      - name: Fuzz the worker's response parser
        run: go test -run FuzzWorkerReadsAResponse -fuzz FuzzWorkerReadsAResponse -fuzztime 60s ./internal/backend/

      # The Go half of the image, on every push.
      #
      # Not the whole image: the worker stage pulls a five-gigabyte CUDA devel
      # base and compiles kernels for four architectures, which is twenty
      # minutes a push to catch a class of error that a GPU-capable build
      # environment would catch anyway. This stage is seconds and it does catch
      # the ones that actually happen -- a Dockerfile that no longer parses, a
      # package that stopped building without cgo, a path that moved.
      - name: The server image builds
        run: docker build --target server -t braid-server-stage .

  # The tests that need a GPU, which is why they are not in the job above.
  #
  # Nothing in the free runner fleet has one, so this job is manual and expects
  # a self-hosted runner labelled `gpu`. Until one is registered it does not run
  # at all -- and it is worth being blunt about what that means: the divergence
  # measurements, the chaos harness and the failover-with-a-warm-cache check all
  # run on one desk, and the green badge on the job above does not cover them.
  #
  # workflow_dispatch only, deliberately. A `push` trigger with no matching
  # runner queues forever and reports as pending, which is worse than not
  # running: it looks like coverage.
  gpu:
    # workflow_dispatch only. See the note above: a push trigger with no matching
    # runner queues forever and reports as pending, which looks like coverage.
    #
    # It is also the security boundary. This repository is public, and a
    # self-hosted runner will execute whatever a workflow tells it to on the
    # machine it is registered from. Dispatch can only be started by someone with
    # write access, so a fork cannot reach this job -- but a fork *can* propose a
    # workflow of its own, which is why "Require approval for all external
    # contributors" belongs on in the repository's Actions settings before a
    # runner is ever registered.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gpu]
    # Sixty, not thirty. A run that finds a checkpoint already in the tool cache
    # takes about six minutes; one that has to train takes thirty-five, and the
    # first run on any new runner is always the second kind. Thirty was set on
    # the assumption the cache would be warm, which cancelled the first real run
    # at exactly the training step.
    timeout-minutes: 60
    defaults:
      run:
        # The runner picks PowerShell on Windows and sh elsewhere; these steps
        # are written once, in bash, and Git Bash ships with the toolchain this
        # job already needs.
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Build the worker
        run: |
          cmake -B build -S engine -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target braid_worker braid_train braid_test_cached

      # The checkpoint lives outside the workspace and survives between runs.
      #
      # Training is thirty-five minutes and depends on the model's geometry, not
      # on the commit, so doing it every push would spend the entire job on a
      # file that almost never changes. It is regenerated when the geometry does:
      # the key is a hash of charmodel.hpp, which is where kSeqLen and the block
      # count live, and of train.cpp.
      #
      # RUNNER_TOOL_CACHE is the runner's own persistent directory. Using it
      # rather than a path in the workspace is what makes "survives between runs"
      # true -- the workspace is wiped.
      - name: A checkpoint, trained only when the model changes
        id: model
        run: |
          key=$(cat engine/charmodel.hpp engine/train.cpp | sha256sum | cut -c1-16)
          dir="${RUNNER_TOOL_CACHE}/braid-model-${key}"
          if [ ! -f "${dir}/charlm.bin" ]; then
            echo "no checkpoint for geometry ${key}; training one (about 35 minutes)"
            mkdir -p "${dir}"
            ./build/braid_train* . "${dir}/charlm" 6000
          else
            echo "reusing the checkpoint for geometry ${key}"
          fi
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      # -p 1 is not decoration. Go runs packages in parallel, three of them start
      # real workers, and two processes wanting seven gigabytes do not fit on
      # eight. The symptom is "did not answer within 30s", which reads like a
      # hang and is a queue for memory.
      - name: The suite, against a real card
        env:
          BRAID_MODEL: ${{ steps.model.outputs.dir }}/charlm
        run: |
          # Absolute, and that is the whole point: go test runs each package
          # from that package's own directory, so a relative path resolves
          # against internal/sched rather than the repository root and every
          # test that needs a worker reports "cannot find the path specified".
          export BRAID_WORKER=$(ls "$GITHUB_WORKSPACE"/build/braid_worker*)

          # A worker left behind by a cancelled run would hold the card and make
          # this one look like a memory problem. Nothing usually survives, and
          # the cost of checking is nothing.
          taskkill //F //IM braid_worker.exe //T > /dev/null 2>&1 || true

          set +e
          go test -p 1 -count=1 -timeout 25m ./internal/... 2>&1 | tee "$RUNNER_TEMP/gotest.log"
          status=${PIPESTATUS[0]}
          set -e

          # Any FAIL is a failure, whatever the exit code says.
          if grep -qE '^(FAIL|--- FAIL)' "$RUNNER_TEMP/gotest.log"; then
            exit 1
          fi

          # And one specific non-failure that exits non-zero anyway. After the
          # backend tests -- which start and kill real worker processes --
          # Windows can hold the test binary's handle past the point go tries to
          # delete it, and go reports `unlinkat ... Access is denied` and exits
          # 1 with every package marked ok. It happens on this machine outside
          # CI too, and it is a cleanup race rather than a result.
          #
          # Swallowed narrowly: this branch is only reached when no line began
          # with FAIL, and only for that message. Anything else still fails.
          if [ "$status" -ne 0 ]; then
            if grep -q 'unlinkat.*Access is denied' "$RUNNER_TEMP/gotest.log"; then
              echo "::warning::every package passed; go could not delete its own test binary"
            else
              exit "$status"
            fi
          fi

      - name: Cached decode agrees with recomputation
        run: |
          ENGINE_CUDA_MIN_FLOPS=1 ENGINE_CUDA_MIN_ELEMENTS=1 ENGINE_CUDA_MIN_LAYERNORM=1             ./build/braid_test_cached* "${{ steps.model.outputs.dir }}/charlm"

      # The half of the container CI cannot otherwise reach. The server stage is
      # built on every push by the job above; this stage pulls a five-gigabyte
      # base and compiles four architectures, so it belongs where there is
      # already a GPU toolchain and no hurry.
      - name: The worker image builds
        continue-on-error: true
        run: docker build --target worker -t braid-worker-stage .
