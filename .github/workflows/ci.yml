name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The GPU job below runs on nothing but this. See its comment for why a push
  # trigger would be worse than no trigger.
  workflow_dispatch:
  # And the image job, which is twenty minutes and changes only when the
  # Dockerfile or the engine does.
  schedule:
    - cron: '0 5 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -count=2 because the scheduler's tests are about concurrency, and a
      # concurrency test that has only ever passed once has not passed yet.
      # -race is the point of running this on Linux: the toolchain needs cgo
      # for it, which a plain Windows checkout does not have.
      - name: Test
        run: go test -race -count=2 ./...

      # The allocation gate, run without -race.
      #
      # The race detector allocates on its own account, so allocs/op under it is
      # a different number and not a stable one. The gate is about the code's
      # allocations, so it gets a plain run -- and it is cheap, because the
      # benchmark it drives is against the mock backend.
      - name: Allocation regression gate
        run: go test -run TestTheHotLoopDoesNotGrowItsAllocations -count=1 -v ./internal/sched/

      # Fuzz seeds run in the normal suite; this gives the response parser a
      # minute of actual fuzzing on every push. Any crash is written to
      # testdata/ and fails the job.
      - name: Fuzz the worker's response parser
        run: go test -run FuzzWorkerReadsAResponse -fuzz FuzzWorkerReadsAResponse -fuzztime 60s ./internal/backend/

      # The Go half of the image, on every push.
      #
      # Not the whole image: the worker stage pulls a five-gigabyte CUDA devel
      # base and compiles kernels for four architectures, which is twenty
      # minutes a push to catch a class of error that a GPU-capable build
      # environment would catch anyway. This stage is seconds and it does catch
      # the ones that actually happen -- a Dockerfile that no longer parses, a
      # package that stopped building without cgo, a path that moved.
      - name: The server image builds
        run: docker build --target server -t braid-server-stage .

  # The tests that need a GPU, which is why they are not in the job above.
  #
  # Nothing in the free runner fleet has one, so this job is manual and expects
  # a self-hosted runner labelled `gpu`. Until one is registered it does not run
  # at all -- and it is worth being blunt about what that means: the divergence
  # measurements, the chaos harness and the failover-with-a-warm-cache check all
  # run on one desk, and the green badge on the job above does not cover them.
  #
  # workflow_dispatch only, deliberately. A `push` trigger with no matching
  # runner queues forever and reports as pending, which is worse than not
  # running: it looks like coverage.
  gpu:
    # workflow_dispatch only. See the note above: a push trigger with no matching
    # runner queues forever and reports as pending, which looks like coverage.
    #
    # It is also the security boundary. This repository is public, and a
    # self-hosted runner will execute whatever a workflow tells it to on the
    # machine it is registered from. Dispatch can only be started by someone with
    # write access, so a fork cannot reach this job -- but a fork *can* propose a
    # workflow of its own, which is why "Require approval for all external
    # contributors" belongs on in the repository's Actions settings before a
    # runner is ever registered.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gpu]
    # Sixty, not thirty. A run that finds a checkpoint already in the tool cache
    # takes about six minutes; one that has to train takes thirty-five, and the
    # first run on any new runner is always the second kind. Thirty was set on
    # the assumption the cache would be warm, which cancelled the first real run
    # at exactly the training step.
    timeout-minutes: 60
    defaults:
      run:
        # Git Bash by path, not by name.
        #
        # `shell: bash` resolves through PATH, and on Windows several things
        # answer to that name. Installing WSL puts a bash.exe stub in
        # WindowsApps ahead of Git's, and with no distribution behind it every
        # step printed "Windows Subsystem for Linux has no distributions
        # installed" and exited 1. Before that the job had been picking Git Bash
        # by luck rather than by choice.
        #
        # Named outright, so which shell runs is a decision instead of a race
        # between PATH entries. Git for Windows is a hard requirement for the
        # runner and installs here; if it is somewhere else this fails at once
        # and says so, which beats running a shell nobody chose.
        shell: 'C:\Program Files\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      # The toolchain, found rather than inherited.
      #
      # nvcc needs MSVC's headers and libraries, and those arrive only from
      # vcvars64.bat -- which meant this job depended on *how the runner process
      # was started*. Launched from a shell that had already sourced vcvars, the
      # build worked; launched as a service or from a plain terminal it failed at
      # `cstdint: No such file or directory`, with nothing in the error pointing
      # at the cause.
      #
      # vswhere ships with the Visual Studio Installer at a fixed location and is
      # the supported way to find an installation, so none of this is pinned to
      # one machine's layout. Only the four variables that matter are exported:
      # dumping the whole environment into GITHUB_ENV works right up until some
      # variable contains a newline.
      - name: MSVC and CMake on PATH
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (
            echo The Visual Studio Installer is not present, so the C++ toolchain cannot be located.
            exit /b 1
          )
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          if not defined VSDIR (
            echo No Visual Studio installation carries the x64 C++ tools.
            exit /b 1
          )
          echo Using %VSDIR%
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1

          rem CMake is a separate install and vcvars does not always bring one.
          rem PATH first, then the two places installers put it, so this stays
          rem free of any particular machine's directories.
          where cmake >nul 2>&1
          if errorlevel 1 (
            for /d %%d in ("%LOCALAPPDATA%\Programs\cmake-*") do set "PATH=%%d\bin;%PATH%"
            if exist "%ProgramFiles%\CMake\bin\cmake.exe" set "PATH=%ProgramFiles%\CMake\bin;%PATH%"
          )
          where cmake >nul 2>&1
          if errorlevel 1 (
            echo CMake is not installed on this runner.
            exit /b 1
          )

          rem Git Bash, ahead of anything else called bash.
          rem
          rem `shell: bash` resolves through PATH, and on Windows more than one
          rem thing answers to that name. Installing WSL puts a bash.exe stub in
          rem WindowsApps that comes first; with no distribution behind it, every
          rem step below printed "Windows Subsystem for Linux has no distributions
          rem installed" and exited 1. The job had been picking Git Bash by luck.
          rem
          rem Git is a hard requirement for the runner, so its location is a thing
          rem that can be asked about rather than assumed.
          for /f "usebackq tokens=*" %%g in (`where git`) do set "GITEXE=%%g"
          if defined GITEXE for %%d in ("%GITEXE%\..\..") do set "GITROOT=%%~fd"
          if exist "%GITROOT%\bin\bash.exe" (
            set "PATH=%GITROOT%\bin;%PATH%"
          ) else (
            echo Git Bash was not found next to git, and these steps are written in bash.
            exit /b 1
          )

          >>"%GITHUB_ENV%" echo PATH=%PATH%
          >>"%GITHUB_ENV%" echo INCLUDE=%INCLUDE%
          >>"%GITHUB_ENV%" echo LIB=%LIB%
          >>"%GITHUB_ENV%" echo LIBPATH=%LIBPATH%

      - name: Build the worker
        run: |
          cmake --version
          cmake -B build -S engine -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target braid_worker braid_train braid_test_cached

      # The checkpoint lives outside the workspace and survives between runs.
      #
      # Training is thirty-five minutes and depends on the model's geometry, not
      # on the commit, so doing it every push would spend the entire job on a
      # file that almost never changes. It is regenerated when the geometry does:
      # the key is a hash of charmodel.hpp, which is where kSeqLen and the block
      # count live, and of train.cpp.
      #
      # RUNNER_TOOL_CACHE is the runner's own persistent directory. Using it
      # rather than a path in the workspace is what makes "survives between runs"
      # true -- the workspace is wiped.
      - name: A checkpoint, trained only when the model changes
        id: model
        run: |
          key=$(cat engine/charmodel.hpp engine/train.cpp | sha256sum | cut -c1-16)
          dir="${RUNNER_TOOL_CACHE}/braid-model-${key}"
          if [ ! -f "${dir}/charlm.bin" ]; then
            echo "no checkpoint for geometry ${key}; training one (about 35 minutes)"
            mkdir -p "${dir}"
            ./build/braid_train* . "${dir}/charlm" 6000
          else
            echo "reusing the checkpoint for geometry ${key}"
          fi
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      # -p 1 is not decoration. Go runs packages in parallel, three of them start
      # real workers, and two processes wanting seven gigabytes do not fit on
      # eight. The symptom is "did not answer within 30s", which reads like a
      # hang and is a queue for memory.
      - name: The suite, against a real card
        env:
          BRAID_MODEL: ${{ steps.model.outputs.dir }}/charlm
        run: |
          # Absolute, and that is the whole point: go test runs each package
          # from that package's own directory, so a relative path resolves
          # against internal/sched rather than the repository root and every
          # test that needs a worker reports "cannot find the path specified".
          export BRAID_WORKER=$(ls "$GITHUB_WORKSPACE"/build/braid_worker*)

          # A worker left behind by a cancelled run would hold the card and make
          # this one look like a memory problem. Nothing usually survives, and
          # the cost of checking is nothing.
          taskkill //F //IM braid_worker.exe //T > /dev/null 2>&1 || true

          set +e
          go test -p 1 -count=1 -timeout 25m ./internal/... 2>&1 | tee "$RUNNER_TEMP/gotest.log"
          status=${PIPESTATUS[0]}
          set -e

          # Any FAIL is a failure, whatever the exit code says.
          if grep -qE '^(FAIL|--- FAIL)' "$RUNNER_TEMP/gotest.log"; then
            exit 1
          fi

          # And one specific non-failure that exits non-zero anyway. After the
          # backend tests -- which start and kill real worker processes --
          # Windows can hold the test binary's handle past the point go tries to
          # delete it, and go reports `unlinkat ... Access is denied` and exits
          # 1 with every package marked ok. It happens on this machine outside
          # CI too, and it is a cleanup race rather than a result.
          #
          # Swallowed narrowly: this branch is only reached when no line began
          # with FAIL, and only for that message. Anything else still fails.
          if [ "$status" -ne 0 ]; then
            if grep -q 'unlinkat.*Access is denied' "$RUNNER_TEMP/gotest.log"; then
              echo "::warning::every package passed; go could not delete its own test binary"
            else
              exit "$status"
            fi
          fi

      - name: Cached decode agrees with recomputation
        run: |
          ENGINE_CUDA_MIN_FLOPS=1 ENGINE_CUDA_MIN_ELEMENTS=1 ENGINE_CUDA_MIN_LAYERNORM=1             ./build/braid_test_cached* "${{ steps.model.outputs.dir }}/charlm"

  # The image's CUDA stage, on a runner that can build it.
  #
  # This lived in the gpu job for a while, on the reasoning that a stage which
  # compiles CUDA belongs where the CUDA toolchain is. That reasoning is wrong:
  # the toolchain is *inside the container*, pulled with the base image, and what
  # the build actually needs is Docker. The self-hosted runner is the one machine
  # here that does not have it, so the step sat on the only host that could never
  # run it -- and for one run it was `continue-on-error`, failing with `command
  # not found` while the job reported green.
  #
  # A hosted runner has Docker and no GPU, which is exactly right: building an
  # image does not need a card, and running the result is not what this checks.
  #
  # Not on every push. It pulls a five-gigabyte base and compiles for four
  # architectures, which is twenty minutes to catch a class of error that changes
  # only when the Dockerfile or the engine does. Weekly, and on demand.
  image:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # The base image alone is most of a hosted runner's free space, so the
      # preinstalled toolchains nothing here uses go first. Without this the
      # build dies partway through nvcc with no disk left and an error that
      # blames the compiler.
      - name: Room for a five-gigabyte base image
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h / | tail -1

      - name: The worker stage builds
        run: docker build --target worker -t braid-worker-stage .

      # The whole thing, not just the stage that compiles. The runtime layer is
      # where an image usually breaks in a way the build stage cannot show: a
      # library the engine's CPU fallback needs and the runtime base does not
      # carry, and the worker exits at load with a link error saying nothing
      # about GPUs.
      - name: And the whole image
        run: |
          docker build -t braid .
          docker image inspect braid --format 'size: {{.Size}} bytes'

      # Without a GPU the worker cannot serve, but it can still be asked whether
      # it starts -- which is what proves the runtime layer carries what it needs.
      # A missing libgomp1 fails here and nowhere else.
      - name: The worker in the image starts
        run: |
          docker run --rm --entrypoint /usr/local/bin/braid_worker braid 2>&1 | head -5 || true
          docker run --rm --entrypoint sh braid -c 'ldd /usr/local/bin/braid_worker | grep -c "not found" | grep -qx 0'
          echo "every shared library the worker needs is present in the runtime image"
